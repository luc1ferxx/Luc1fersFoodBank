version: 2

updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      testcontainers:
        patterns:
          - "org.testcontainers*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images of the Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /
      - /backend
    schedule:
      interval: weekly

  # Images of the local infrastructure and observability stacks.
  - package-ecosystem: docker-compose
    directories:
      - /backend
      - /deploy/observability
    schedule:
      interval: monthly
