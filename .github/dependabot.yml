version: 2

updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      testcontainers:
        patterns:
          - "org.testcontainers*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must stay on the same version; separate PRs fail npm ci.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # @types/node follows the Node major used by CI and the Dockerfile (Node 20); bump them together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images of the Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /
      - /backend
    schedule:
      interval: weekly
    ignore:
      # Runtime majors are deliberate upgrades: the JRE stays on the Java 17 LTS line the toolchain targets, and the
      # Node image follows the Node version in CI. Patch and minor updates still come through.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Images of the local infrastructure and observability stacks.
  - package-ecosystem: docker-compose
    directories:
      - /backend
      - /deploy/observability
    schedule:
      interval: monthly
    ignore:
      # Major versions of the data stores need a coordinated upgrade: the Testcontainers images, both compose files and
      # the docs move together, and Postgres majors cannot start on an older data volume.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache/kafka-native"
        update-types: ["version-update:semver-major"]
