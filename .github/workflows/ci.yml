name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # The release workflow runs the same jobs before it publishes an image.
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The test classes are split over several runners (-PtestShard=i/N, backend/build.gradle); each shard uploads its
  # results and its JaCoCo data, and backend-coverage merges the data for the coverage gate. SpotBugs runs on its own.
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARDS: 4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x gradlew
      # Testcontainers needs the runner's Docker.
      - name: Tests (shard ${{ matrix.shard }} of ${{ env.SHARDS }})
        run: >-
          ./gradlew test -PtestShard=${{ matrix.shard }}/${{ env.SHARDS }}
          -x buildFrontend -x syncFrontendBuild --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ matrix.shard }}
          path: |
            backend/build/test-results/test
            backend/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-${{ matrix.shard }}
          path: backend/build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 1

  backend-coverage:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x gradlew
      - name: Download the shards' coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: backend-jacoco-*
          path: backend/build/jacoco/shards
      - name: Coverage report and gate
        run: >-
          ./gradlew jacocoTestReport jacocoTestCoverageVerification -PjacocoShards -x test
          -x buildFrontend -x syncFrontendBuild --no-daemon
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          path = "build/reports/jacoco/test/jacocoTestReport.xml"
          if not os.path.exists(path):
              print("No JaCoCo report was produced.")
              raise SystemExit(0)
          print("| Counter | Covered | Missed | Coverage |")
          print("| --- | --- | --- | --- |")
          for counter in ET.parse(path).getroot().findall("counter"):
              covered, missed = int(counter.get("covered")), int(counter.get("missed"))
              print(f"| {counter.get('type')} | {covered} | {missed} | {covered / (covered + missed):.1%} |")
          EOF
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/test
          if-no-files-found: ignore
          retention-days: 14

  backend-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x gradlew
      - name: SpotBugs
        run: ./gradlew spotbugsMain -x buildFrontend -x syncFrontendBuild --no-daemon
      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-spotbugs-report
          path: backend/build/reports/spotbugs
          if-no-files-found: ignore
          retention-days: 14

  # Observability, Kubernetes and workflow configuration: the same checks as docs/operations.md.
  config-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus rules, rule tests and config
        run: |
          promtool() {
            docker run --rm --entrypoint /bin/promtool \
              -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
              -w /etc/prometheus prom/prometheus:v3.13.4 "$@"
          }
          promtool check rules alerts.yml
          promtool test rules alerts.test.yml
          promtool check config prometheus.yml
      - name: Observability compose file
        run: docker compose -f deploy/observability/docker-compose.yml --profile app config --quiet
      - name: Grafana dashboards are valid JSON
        run: |
          for dashboard in deploy/observability/grafana/dashboards/*.json; do
            python3 -m json.tool "$dashboard" > /dev/null
          done
      - name: Kubernetes manifests (kustomize + kubeconform)
        run: |
          mkdir -p "$RUNNER_TEMP/k8s"
          kubectl kustomize deploy/k8s/base > "$RUNNER_TEMP/k8s/base.yaml"
          kubectl kustomize deploy/k8s/overlays/staging > "$RUNNER_TEMP/k8s/staging.yaml"
          kubectl kustomize deploy/k8s/overlays/prod > "$RUNNER_TEMP/k8s/prod.yaml"
          docker run --rm -v "$RUNNER_TEMP/k8s:/manifests:ro" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.31.0 /manifests
      - name: Workflow files (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      # EventSchemaContractTests (backend-test shards) checks the schema files against SHA256SUMS; this keeps a pull request
      # from changing a published file and its checksum together. Only new files and new SHA256SUMS lines may appear;
      # catalog.json may change (new versions, retirements).
      - name: Published event schemas are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCHEMAS: backend/src/main/resources/event-schemas
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only --diff-filter=DMRT "$BASE_SHA" HEAD -- "$SCHEMAS" \
            ":(exclude)$SCHEMAS/catalog.json" ":(exclude)$SCHEMAS/SHA256SUMS")
          if [ -n "$changed" ]; then
            echo "::error::Published event schemas never change; publish the next version instead (docs/correctness.md \"Event contracts\"):"
            echo "$changed"
            exit 1
          fi
          removed=$(git diff -U0 "$BASE_SHA" HEAD -- "$SCHEMAS/SHA256SUMS" | grep -E '^-[0-9a-f]{64}' || true)
          if [ -n "$removed" ]; then
            echo "::error::Lines of $SCHEMAS/SHA256SUMS were changed or removed:"
            echo "$removed"
            exit 1
          fi

  # Independent of the test jobs: the jar is only an artifact of the run, which is red anyway when a test fails.
  package-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build backend jar
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: onlineorder-bootjar
          path: backend/build/libs/*.jar
