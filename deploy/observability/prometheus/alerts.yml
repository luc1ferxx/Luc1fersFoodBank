# Recording and alerting rules for the OnlineOrder service. Metric names are those of /actuator/prometheus; every
# application meter carries application="OnlineOrder" (management.metrics.tags.application).
#
# SLOs behind the rules:
#   - availability: fewer than 1% of requests answer 5xx
#   - latency: 99% of requests complete within 500ms (the le="0.5" SLO bucket of http.server.requests)
# Validate with: promtool check rules alerts.yml && promtool test rules alerts.test.yml
groups:
  - name: onlineorder-slo-recording
    interval: 30s
    rules:
      - record: onlineorder:http_requests:rate5m
        expr: sum(rate(http_server_requests_seconds_count{application="OnlineOrder", uri!~"/actuator.*"}[5m]))

      - record: onlineorder:http_server_errors:ratio_rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{application="OnlineOrder", uri!~"/actuator.*", status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="OnlineOrder", uri!~"/actuator.*"}[5m]))

      # Share of requests slower than the 500ms latency objective, over the burn-rate windows. The push stream
      # (/events/stream) is left out: each one is a request that stays open until it times out (30 minutes).
      - record: onlineorder:http_slow_requests:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_bucket{application="OnlineOrder", uri!~"/actuator.*|/events/stream", le="0.5"}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{application="OnlineOrder", uri!~"/actuator.*|/events/stream"}[5m]))
          )
      - record: onlineorder:http_slow_requests:ratio_rate30m
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_bucket{application="OnlineOrder", uri!~"/actuator.*|/events/stream", le="0.5"}[30m]))
            /
            sum(rate(http_server_requests_seconds_count{application="OnlineOrder", uri!~"/actuator.*|/events/stream"}[30m]))
          )
      - record: onlineorder:http_slow_requests:ratio_rate1h
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_bucket{application="OnlineOrder", uri!~"/actuator.*|/events/stream", le="0.5"}[1h]))
            /
            sum(rate(http_server_requests_seconds_count{application="OnlineOrder", uri!~"/actuator.*|/events/stream"}[1h]))
          )
      - record: onlineorder:http_slow_requests:ratio_rate6h
        expr: |
          1 - (
            sum(rate(http_server_requests_seconds_bucket{application="OnlineOrder", uri!~"/actuator.*|/events/stream", le="0.5"}[6h]))
            /
            sum(rate(http_server_requests_seconds_count{application="OnlineOrder", uri!~"/actuator.*|/events/stream"}[6h]))
          )

  - name: onlineorder-alerts
    rules:
      - alert: OnlineOrderTargetDown
        expr: up{job="onlineorder"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: OnlineOrder instance {{ $labels.instance }} cannot be scraped
          description: Prometheus has failed to scrape {{ $labels.instance }} for 1 minute. The instance is down or its management port (8081) is unreachable.

      - alert: OnlineOrderHighErrorRate
        expr: onlineorder:http_server_errors:ratio_rate5m > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of OnlineOrder requests fail with 5xx
          description: '{{ $value | humanizePercentage }} of requests answered 5xx over the last 5 minutes. 503 SERVICE_UNAVAILABLE means the Hikari pool is saturated; check the Hikari pending panel.'

      # Multi-window burn rate on the latency objective (1% budget): 14.4x burns 2% of a 30-day budget in an hour.
      - alert: OnlineOrderLatencySLOFastBurn
        expr: |
          onlineorder:http_slow_requests:ratio_rate1h > (14.4 * 0.01)
          and
          onlineorder:http_slow_requests:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: OnlineOrder latency SLO is burning fast
          description: More than 14.4% of requests took longer than 500ms over both the last hour and the last 5 minutes (objective - 99% within 500ms).

      - alert: OnlineOrderLatencySLOSlowBurn
        expr: |
          onlineorder:http_slow_requests:ratio_rate6h > (6 * 0.01)
          and
          onlineorder:http_slow_requests:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: OnlineOrder latency SLO is burning steadily
          description: More than 6% of requests took longer than 500ms over both the last 6 hours and the last 30 minutes (objective - 99% within 500ms).

      # The publisher polls every 500ms, so a healthy backlog is seconds old. A Kafka outage pauses it with a backoff
      # capped at app.outbox.failure-backoff-max (60s).
      - alert: OnlineOrderOutboxBacklogStale
        expr: max(onlineorder_outbox_oldest_pending_age_seconds{application="OnlineOrder"}) > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox events wait more than 2 minutes for Kafka
          description: The oldest unpublished outbox event is {{ $value | humanizeDuration }} old. Order events are not reaching Kafka; check broker reachability and the outbox publisher logs.

      - alert: OnlineOrderOutboxBacklogCritical
        expr: max(onlineorder_outbox_oldest_pending_age_seconds{application="OnlineOrder"}) > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Outbox events wait more than 15 minutes for Kafka
          description: The oldest unpublished outbox event is {{ $value | humanizeDuration }} old.

      - alert: OnlineOrderOutboxEventsFailed
        expr: max(onlineorder_outbox_failed{application="OnlineOrder"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Outbox events reached FAILED
          description: '{{ $value }} outbox event(s) used up app.outbox.max-attempts. Fix the cause, then retry them with POST /admin/outbox/events/{id}/retry.'

      # The publisher keeps each aggregate's events in order (docs/correctness.md "Event contracts"), so a FAILED event holds back
      # the later events of its order or delivery until an operator retries or abandons it: that order's fulfilment is
      # stuck.
      - alert: OnlineOrderOutboxAggregatesBlocked
        expr: max(onlineorder_outbox_blocked_aggregates{application="OnlineOrder"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox events are held back behind a FAILED event of their aggregate
          description: '{{ $value }} aggregate(s) have later outbox events waiting behind a FAILED one (onlineorder_outbox_blocked_events counts them). Fix the cause, then retry the FAILED event with POST /admin/outbox/events/{id}/retry; the held-back events follow in order. Only an event that can never be published is abandoned instead (POST /admin/outbox/events/{id}/abandon, docs/operations.md section 8).'

      # A producer-side violation is a bug (its transaction was rolled back); a consumer-side one is a record that was
      # dead-lettered without retries. The counter series starts at 1 like the dead-letter counter, hence the second
      # branch.
      - alert: OnlineOrderEventSchemaViolations
        expr: |
          sum by (side) (increase(onlineorder_events_schema_violations_total{application="OnlineOrder"}[15m])) > 0
          or
          count by (side) (
            onlineorder_events_schema_violations_total{application="OnlineOrder"}
            unless
            onlineorder_events_schema_violations_total{application="OnlineOrder"} offset 15m
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: Events broke their published contract ({{ $labels.side }})
          description: 'Events that do not match their schema under event-schemas/ were seen on the {{ $labels.side }} side in the last 15 minutes. Producer: the writing transaction failed (a bug, see the ERROR log). Consumer: the record went straight to the DLT; its error_message lists the violations.'

      # The counter is registered by the first dead letter an instance stores, so its series starts at 1 and
      # increase() cannot see that first event. The second branch catches a series that appeared within the window
      # (the first dead letter after a start, or of a new source topic); increase() covers the rest, counter resets
      # included.
      - alert: OnlineOrderDeadLettersGrowing
        expr: |
          sum(increase(onlineorder_dead_letter_stored_total{application="OnlineOrder"}[15m])) > 0
          or
          count(
            onlineorder_dead_letter_stored_total{application="OnlineOrder"}
            unless
            onlineorder_dead_letter_stored_total{application="OnlineOrder"} offset 15m
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: Order events are being dead-lettered
          description: Events were stored as dead letters in the last 15 minutes. Inspect them and replay with POST /dead-letters/{id}/replay once the consumer is fixed.

      - alert: OnlineOrderHikariPendingSustained
        expr: max by (instance) (hikaricp_connections_pending{application="OnlineOrder", pool="onlineorder-db"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Requests keep waiting for a database connection on {{ $labels.instance }}
          description: Threads have been waiting for a pooled connection for 5 minutes ({{ $value }} now). Requests that wait longer than the 2s connection-timeout fail with 503.

      - alert: OnlineOrderHikariConnectionTimeouts
        expr: sum by (instance) (increase(hikaricp_connections_timeout_total{application="OnlineOrder", pool="onlineorder-db"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Database connection requests time out on {{ $labels.instance }}
          description: '{{ $value | humanize }} connection request(s) timed out in the last 5 minutes and were answered 503.'

      # records-lag-max is reported per consumer client (consumer-onlineorder-* for order events,
      # consumer-onlineorder-dlt-* for the dead-letter topic), not per topic.
      - alert: OnlineOrderKafkaConsumerLag
        expr: max by (instance, client_id) (kafka_consumer_fetch_manager_records_lag_max{application="OnlineOrder"}) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Kafka consumer {{ $labels.client_id }} is falling behind
          description: Consumer {{ $labels.client_id }} on {{ $labels.instance }} has been more than 1000 records behind for 10 minutes ({{ $value | humanize }} now).

      # RateLimitingFilter fails open per request: a request whose token-bucket check fails in Redis (down, unreachable,
      # timing out, out of memory, or refusing the EVAL of the bucket script) goes through unchecked and counts once in
      # onlineorder.security.rate_limit.store_failure{route}. When every check fails (Redis down for all instances) no
      # bucket refuses anything, login and signup included. The series of a route is registered by its first failure,
      # so it starts at 1 and increase() cannot see that one. A half-minute counts when the counter rose within the 2
      # minutes before it, so each failure counts in 3-4 of them at a 10s scrape; the alert fires when 8 of the last 20
      # half-minutes count. The count is the duration guard (no `for`), and unlike a `for` it is not reset by a gap
      # between failures: a dense outage fires about 4 minutes in, sparse traffic whose rate-limited requests keep
      # failing (one every 3 minutes) within about 8 minutes, and a blip of up to about a minute and a half never does.
      # It resolves about 8.5 minutes after the last failure.
      - alert: OnlineOrderRateLimiterFailingOpen
        expr: count_over_time((sum(increase(onlineorder_security_rate_limit_store_failure_total{application="OnlineOrder"}[2m])) > 0)[10m:30s]) >= 8
        labels:
          severity: warning
        annotations:
          summary: The rate limiter is failing open
          description: 'The rate-limit store (Redis) failed bucket checks in {{ $value | humanize }} of the last 20 half-minutes (8 raise this alert), and the rate-limited requests whose check failed went through unchecked; when every check fails no bucket refuses anything (docs/correctness.md "Security and Abuse Controls"). Check that the instances reach Redis, its latency and memory, and that it accepts EVAL; the WARN log "Rate-limit store unavailable for route ... Failing open." has the cause and onlineorder_security_rate_limit_store_failure_total{route} the routes.'

      # Monthly partitions of audit_log, order_status_history and processed_events (PostgreSQL, V10). The partition
      # maintenance job keeps app.partitions.months-ahead (3) partitions past the current month, so a healthy table
      # reports 2-3 here. Fewer means the job has missed a month boundary; at 0, rows of the next month land in the
      # default partition, which retention never drops.
      - alert: OnlineOrderPartitionsAheadLow
        expr: min by (table) (onlineorder_partitions_future{application="OnlineOrder"}) < 2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Few future partitions of {{ $labels.table }}
          description: Only {{ $value }} monthly partition(s) of {{ $labels.table }} exist past the current month (the job keeps 3). Check the partition maintenance logs and onlineorder_partitions_maintenance_failures_total (docs/operations.md section 8).

      - alert: OnlineOrderPartitionsAheadMissing
        expr: min by (table) (onlineorder_partitions_future{application="OnlineOrder"}) < 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: No partition of {{ $labels.table }} exists for next month
          description: From the first of next month new {{ $labels.table }} rows land in {{ $labels.table }}_default. Fix the partition maintenance job or create the partitions by hand (docs/operations.md section 8).

      - alert: OnlineOrderPartitionDefaultRows
        expr: max by (table) (onlineorder_partitions_default_rows{application="OnlineOrder"}) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Rows of {{ $labels.table }} fall outside every monthly partition
          description: '{{ $value }} row(s) sit in {{ $labels.table }}_default. The job moves them into their month when it creates that partition and deletes them once past the retention; rows far in the future or past point at a wrong clock.'

      # Read replicas (docs/operations.md "Read replicas"); the series exist only where DATABASE_REPLICA_URLS is set.
      # A replica beyond app.datasource.replica.max-lag (2s by default; keep the threshold below in step) already gets
      # no reads, they go to the primary. These alerts say it has stayed that way, so the primary carries the replica's
      # read load. The lag is NaN while the replica cannot be measured (unreachable, not a standby); the second alert
      # covers those.
      - alert: OnlineOrderDbReplicaLagging
        expr: max by (instance, replica) (onlineorder_db_replica_lag_seconds{application="OnlineOrder"}) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Read replica {{ $labels.replica }} is behind the primary on {{ $labels.instance }}
          description: '{{ $labels.replica }} has been more than 2s behind the primary for 5 minutes ({{ $value | humanizeDuration }} now) and gets no reads. Check its replay (pg_stat_replication on the primary, long queries or I/O on the replica).'

      - alert: OnlineOrderDbReplicaUnavailable
        expr: max by (instance, replica) (onlineorder_db_replica_routable{application="OnlineOrder"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Read replica {{ $labels.replica }} gets no reads on {{ $labels.instance }}
          description: For 5 minutes {{ $labels.replica }} has been lagging, unreachable or not a standby (the instance logs "Read replica ... gets no reads" with the reason). Its reads go to the primary.

      # After-sales refunds (docs/operations.md section 12). onlineorder.aftersales.refunds counts every refund the
      # executor handled, once per outcome; each outcome's series is registered by its first refund, so it starts at 1
      # and the given-up alert has the second branch of the dead-letter alert. A FAILED refund stays FAILED, with its
      # case REFUNDING, until an admin retries it; the alert only marks when it happened.
      - alert: OnlineOrderRefundsGivenUp
        expr: |
          sum(increase(onlineorder_aftersales_refunds_total{application="OnlineOrder", outcome="failed"}[15m])) > 0
          or
          count(
            onlineorder_aftersales_refunds_total{application="OnlineOrder", outcome="failed"}
            unless
            onlineorder_aftersales_refunds_total{application="OnlineOrder", outcome="failed"} offset 15m
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: After-sales refunds were given up
          description: Refunds reached FAILED in the last 15 minutes and their customers are not refunded. List them with GET /admin/refunds (FAILED by default), read last_error, fix the cause, then retry with POST /admin/refunds/{id}/retry. A refund that does not match its case or payment fails the same way again (docs/operations.md section 12).

      # backed_off: the claim transaction failed after it claimed a refund (a database error, or an exception while the
      # refund was checked against its case and payment). The refund waits app.after-sales.refund.retry-backoff (10s)
      # and is claimed again without using up an attempt, every 10-11 seconds with the defaults, until the cause is fixed
      # or app.after-sales.refund.max-claim-failures (10) of its claims failed in a row, which gives it up (FAILED,
      # OnlineOrderRefundsGivenUp). This fires when claims keep failing, refund after refund.
      - alert: OnlineOrderRefundsBackingOff
        expr: sum(increase(onlineorder_aftersales_refunds_total{application="OnlineOrder", outcome="backed_off"}[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: After-sales refund claims keep failing
          description: '{{ $value | humanize }} refund claim(s) failed and backed off in the last 5 minutes, and claims have kept failing for 15 minutes. These refunds wait without using up attempts; one is given up (FAILED) once 10 of its claims failed in a row. Find them with GET /admin/refunds?status=PENDING or status=PROCESSING (last_error "The claim of attempt ... failed") and the WARN log "The claim of refund ... failed" (docs/operations.md section 12).'

      # Every refund gateway thread is held by a call that outlived app.after-sales.refund-gateway.timeout and ignored
      # its interrupt, so the executor claims no refund: each poller tick that finds no free thread counts once (about
      # one a second). The counter is registered at zero on startup. A few minutes of it is a gateway that hangs.
      - alert: OnlineOrderRefundGatewaySaturated
        expr: sum(increase(onlineorder_aftersales_refund_gateway_saturated_total{application="OnlineOrder"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Refund gateway threads are all held by hung calls
          description: 'No refund was claimed in {{ $value | humanize }} poller run(s) of the last 5 minutes because every refund gateway thread is held by a call that did not return within its timeout, and this has lasted 10 minutes. Due refunds wait without using up attempts. Check the payment gateway; onlineorder_aftersales_refund_gateway_threads_busy shows the held threads (docs/operations.md section 12, "A hung gateway").'

      # A deadline whose step rolled back (a lock timeout, a database error) is tried again after
      # app.after-sales.poller.retry-backoff (30s), with no limit on the tries, and its deadline_at does not move: the
      # customer's and the merchant's answers stay refused, and the case stays in its status past its deadline. One case
      # that keeps failing counts about twice a minute; a blip that clears within 15 minutes raises nothing.
      - alert: OnlineOrderAfterSalesDeadlinesFailing
        expr: sum(increase(onlineorder_aftersales_deadlines_total{application="OnlineOrder", outcome="failed"}[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: After-sales deadlines keep failing to fire
          description: '{{ $value | humanize }} after-sales deadline(s) failed and backed off in the last 5 minutes, and deadlines have kept failing for 15 minutes. Their cases stay in their status past the deadline, and the customer''s and the merchant''s answers are refused meanwhile. The WARN log "After-sales deadline ... failed (attempt N)" names the cases; the overdue cases query is in docs/operations.md section 12, "Deadlines".'

      # A paid order was cancelled with a refund above its captured payment. Its ORDER_CANCELLED case is open, and the
      # refund executor gives its refund up before calling the gateway (OnlineOrderRefundsGivenUp follows). The counter
      # is registered by the first such cancellation, hence the second branch.
      - alert: OnlineOrderCancellationsUndercaptured
        expr: |
          sum(increase(onlineorder_aftersales_cancellations_undercaptured_total{application="OnlineOrder"}[15m])) > 0
          or
          count(
            onlineorder_aftersales_cancellations_undercaptured_total{application="OnlineOrder"}
            unless
            onlineorder_aftersales_cancellations_undercaptured_total{application="OnlineOrder"} offset 15m
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: Paid orders were cancelled with less captured than their refund
          description: The automatic refund of these cancellations will be given up before the gateway is called, and an admin retry fails the same way. The WARN log "Order ... was cancelled with a refund of ..." names the order, the payment and the case; support refunds them by hand (docs/operations.md section 12).
