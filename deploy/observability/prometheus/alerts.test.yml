# Unit tests for alerts.yml: promtool test rules alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 30s

tests:
  - name: target down for a minute
    interval: 1m
    input_series:
      - series: 'up{job="onlineorder", instance="app:8081"}'
        values: '1 1 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: OnlineOrderTargetDown
        exp_alerts: []
      - eval_time: 4m
        alertname: OnlineOrderTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: onlineorder
              instance: app:8081
            exp_annotations:
              summary: OnlineOrder instance app:8081 cannot be scraped
              description: Prometheus has failed to scrape app:8081 for 1 minute. The instance is down or its management port (8081) is unreachable.

  - name: 5xx ratio above 5% for 5 minutes
    interval: 1m
    input_series:
      # 1 request/s answered 200 and 0.1 request/s answered 503: 9.1% errors.
      - series: 'http_server_requests_seconds_count{application="OnlineOrder", uri="/payments/checkout", status="200"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_count{application="OnlineOrder", uri="/payments/checkout", status="503"}'
        values: '0+6x15'
      # Scrapes of the actuator do not count.
      - series: 'http_server_requests_seconds_count{application="OnlineOrder", uri="/actuator/prometheus", status="200"}'
        values: '0+600x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: OnlineOrderHighErrorRate
        exp_alerts: []
      - eval_time: 10m
        alertname: OnlineOrderHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: More than 5% of OnlineOrder requests fail with 5xx
              description: 9.091% of requests answered 5xx over the last 5 minutes. 503 SERVICE_UNAVAILABLE means the Hikari pool is saturated; check the Hikari pending panel.

  - name: healthy traffic raises nothing
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="OnlineOrder", uri="/restaurants/menu", status="200"}'
        values: '0+60x90'
      - series: 'http_server_requests_seconds_bucket{application="OnlineOrder", uri="/restaurants/menu", status="200", le="0.5"}'
        values: '0+60x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: OnlineOrderHighErrorRate
        exp_alerts: []
      - eval_time: 90m
        alertname: OnlineOrderLatencySLOFastBurn
        exp_alerts: []

  - name: push streams do not count against the latency objective
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="OnlineOrder", uri="/orders", status="200"}'
        values: '0+60x90'
      - series: 'http_server_requests_seconds_bucket{application="OnlineOrder", uri="/orders", status="200", le="0.5"}'
        values: '0+60x90'
      # Every stream ends after its 30-minute timeout, so none is within 500ms.
      - series: 'http_server_requests_seconds_count{application="OnlineOrder", uri="/events/stream", status="200"}'
        values: '0+30x90'
      - series: 'http_server_requests_seconds_bucket{application="OnlineOrder", uri="/events/stream", status="200", le="0.5"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: OnlineOrderLatencySLOFastBurn
        exp_alerts: []
      - eval_time: 90m
        alertname: OnlineOrderLatencySLOSlowBurn
        exp_alerts: []

  - name: latency objective burning fast
    interval: 1m
    input_series:
      # Half of the requests take longer than 500ms: 50% against a 1% budget.
      - series: 'http_server_requests_seconds_count{application="OnlineOrder", uri="/orders", status="200"}'
        values: '0+60x90'
      - series: 'http_server_requests_seconds_bucket{application="OnlineOrder", uri="/orders", status="200", le="0.5"}'
        values: '0+30x90'
    alert_rule_test:
      - eval_time: 90m
        alertname: OnlineOrderLatencySLOFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: OnlineOrder latency SLO is burning fast
              description: More than 14.4% of requests took longer than 500ms over both the last hour and the last 5 minutes (objective - 99% within 500ms).

  - name: outbox backlog older than two minutes
    interval: 1m
    input_series:
      - series: 'onlineorder_outbox_oldest_pending_age_seconds{application="OnlineOrder", instance="app:8081"}'
        values: '1 2 3 200 260 320 380 440 500 560'
    alert_rule_test:
      - eval_time: 6m
        alertname: OnlineOrderOutboxBacklogStale
        exp_alerts: []
      - eval_time: 8m
        alertname: OnlineOrderOutboxBacklogStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Outbox events wait more than 2 minutes for Kafka
              description: The oldest unpublished outbox event is 8m 20s old. Order events are not reaching Kafka; check broker reachability and the outbox publisher logs.

  - name: Kafka consumer lag per client
    interval: 1m
    input_series:
      - series: 'kafka_consumer_fetch_manager_records_lag_max{application="OnlineOrder", instance="app:8081", client_id="consumer-onlineorder-1"}'
        values: '0 2000x14'
      - series: 'kafka_consumer_fetch_manager_records_lag_max{application="OnlineOrder", instance="app:8081", client_id="consumer-onlineorder-dlt-4"}'
        values: '0x14'
    alert_rule_test:
      - eval_time: 12m
        alertname: OnlineOrderKafkaConsumerLag
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: app:8081
              client_id: consumer-onlineorder-1
            exp_annotations:
              summary: Kafka consumer consumer-onlineorder-1 is falling behind
              description: Consumer consumer-onlineorder-1 on app:8081 has been more than 1000 records behind for 10 minutes (2k now).

  - name: sustained Hikari pending
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_pending{application="OnlineOrder", pool="onlineorder-db", instance="app:8081"}'
        values: '0 0 3 4 5 6 7 8 9 10'
    alert_rule_test:
      - eval_time: 5m
        alertname: OnlineOrderHikariPendingSustained
        exp_alerts: []
      - eval_time: 8m
        alertname: OnlineOrderHikariPendingSustained
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: app:8081
            exp_annotations:
              summary: Requests keep waiting for a database connection on app:8081
              description: Threads have been waiting for a pooled connection for 5 minutes (9 now). Requests that wait longer than the 2s connection-timeout fail with 503.

  - name: outbox aggregate held back behind a FAILED event
    interval: 1m
    input_series:
      - series: 'onlineorder_outbox_blocked_aggregates{application="OnlineOrder", instance="app:8081"}'
        values: '0 0 2 2 2 2 2 2 2 2 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: OnlineOrderOutboxAggregatesBlocked
        exp_alerts: []
      - eval_time: 8m
        alertname: OnlineOrderOutboxAggregatesBlocked
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Outbox events are held back behind a FAILED event of their aggregate
              description: '2 aggregate(s) have later outbox events waiting behind a FAILED one (onlineorder_outbox_blocked_events counts them). Fix the cause, then retry the FAILED event with POST /admin/outbox/events/{id}/retry; the held-back events follow in order. Only an event that can never be published is abandoned instead (POST /admin/outbox/events/{id}/abandon, docs/operations.md section 8).'
      - eval_time: 11m
        alertname: OnlineOrderOutboxAggregatesBlocked
        exp_alerts: []

  - name: event schema violations on the consumer side
    interval: 1m
    input_series:
      # The first violation of an instance registers the series at 1; a later one raises it.
      - series: 'onlineorder_events_schema_violations_total{application="OnlineOrder", instance="app:8081", side="consumer", topic="order-events", event_type="order.paid"}'
        values: '_x20 1x20 2x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: OnlineOrderEventSchemaViolations
        exp_alerts: []
      - eval_time: 25m
        alertname: OnlineOrderEventSchemaViolations
        exp_alerts:
          - exp_labels:
              severity: warning
              side: consumer
            exp_annotations:
              summary: Events broke their published contract (consumer)
              description: 'Events that do not match their schema under event-schemas/ were seen on the consumer side in the last 15 minutes. Producer: the writing transaction failed (a bug, see the ERROR log). Consumer: the record went straight to the DLT; its error_message lists the violations.'
      - eval_time: 38m
        alertname: OnlineOrderEventSchemaViolations
        exp_alerts: []
      - eval_time: 45m
        alertname: OnlineOrderEventSchemaViolations
        exp_alerts:
          - exp_labels:
              severity: warning
              side: consumer
            exp_annotations:
              summary: Events broke their published contract (consumer)
              description: 'Events that do not match their schema under event-schemas/ were seen on the consumer side in the last 15 minutes. Producer: the writing transaction failed (a bug, see the ERROR log). Consumer: the record went straight to the DLT; its error_message lists the violations.'

  # onlineorder.dead_letter.stored is registered by the first dead letter, so its series starts at 1.
  - name: first dead letter after a start
    interval: 1m
    input_series:
      - series: 'onlineorder_dead_letter_stored_total{application="OnlineOrder", instance="app:8081", source_topic="order-events"}'
        values: '_ _ _ 1x30'
    alert_rule_test:
      - eval_time: 2m
        alertname: OnlineOrderDeadLettersGrowing
        exp_alerts: []
      - eval_time: 5m
        alertname: OnlineOrderDeadLettersGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order events are being dead-lettered
              description: Events were stored as dead letters in the last 15 minutes. Inspect them and replay with POST /dead-letters/{id}/replay once the consumer is fixed.
      # Resolves once the window no longer holds the event.
      - eval_time: 25m
        alertname: OnlineOrderDeadLettersGrowing
        exp_alerts: []

  - name: later dead letters on an existing series
    interval: 1m
    input_series:
      - series: 'onlineorder_dead_letter_stored_total{application="OnlineOrder", instance="app:8081", source_topic="order-events"}'
        values: '1x24 2x10'
    alert_rule_test:
      - eval_time: 20m
        alertname: OnlineOrderDeadLettersGrowing
        exp_alerts: []
      - eval_time: 27m
        alertname: OnlineOrderDeadLettersGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order events are being dead-lettered
              description: Events were stored as dead letters in the last 15 minutes. Inspect them and replay with POST /dead-letters/{id}/replay once the consumer is fixed.

  # A restarted pod gets a new instance label; its counter starts over at 1 while the old series goes stale.
  - name: first dead letter on a replacement instance
    interval: 1m
    input_series:
      - series: 'onlineorder_dead_letter_stored_total{application="OnlineOrder", instance="10.0.0.1:8081", source_topic="order-events"}'
        values: '3x19 stale'
      - series: 'onlineorder_dead_letter_stored_total{application="OnlineOrder", instance="10.0.0.2:8081", source_topic="order-events"}'
        values: '_x25 1x10'
    alert_rule_test:
      - eval_time: 22m
        alertname: OnlineOrderDeadLettersGrowing
        exp_alerts: []
      - eval_time: 27m
        alertname: OnlineOrderDeadLettersGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Order events are being dead-lettered
              description: Events were stored as dead letters in the last 15 minutes. Inspect them and replay with POST /dead-letters/{id}/replay once the consumer is fixed.

  # The maintenance job stops: processed_events runs down from 3 future partitions to 1, then 0; audit_log is fine.
  - name: monthly partitions run out
    interval: 1m
    input_series:
      - series: 'onlineorder_partitions_future{application="OnlineOrder", instance="app:8081", table="processed_events"}'
        values: '3x29 1x99 0x30'
      - series: 'onlineorder_partitions_future{application="OnlineOrder", instance="app:8081", table="audit_log"}'
        values: '3x160'
    alert_rule_test:
      - eval_time: 80m
        alertname: OnlineOrderPartitionsAheadLow
        exp_alerts: []
      - eval_time: 100m
        alertname: OnlineOrderPartitionsAheadLow
        exp_alerts:
          - exp_labels:
              severity: warning
              table: processed_events
            exp_annotations:
              summary: Few future partitions of processed_events
              description: Only 1 monthly partition(s) of processed_events exist past the current month (the job keeps 3). Check the partition maintenance logs and onlineorder_partitions_maintenance_failures_total (docs/operations.md section 8).
      - eval_time: 135m
        alertname: OnlineOrderPartitionsAheadMissing
        exp_alerts: []
      - eval_time: 145m
        alertname: OnlineOrderPartitionsAheadMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              table: processed_events
            exp_annotations:
              summary: No partition of processed_events exists for next month
              description: From the first of next month new processed_events rows land in processed_events_default. Fix the partition maintenance job or create the partitions by hand (docs/operations.md section 8).

  - name: rows in a default partition
    interval: 1m
    input_series:
      - series: 'onlineorder_partitions_default_rows{application="OnlineOrder", instance="app:8081", table="audit_log"}'
        values: '0x10 5x90'
      - series: 'onlineorder_partitions_default_rows{application="OnlineOrder", instance="app:8081", table="processed_events"}'
        values: '0x100'
    alert_rule_test:
      - eval_time: 60m
        alertname: OnlineOrderPartitionDefaultRows
        exp_alerts: []
      - eval_time: 80m
        alertname: OnlineOrderPartitionDefaultRows
        exp_alerts:
          - exp_labels:
              severity: warning
              table: audit_log
            exp_annotations:
              summary: Rows of audit_log fall outside every monthly partition
              description: 5 row(s) sit in audit_log_default. The job moves them into their month when it creates that partition and deletes them once past the retention; rows far in the future or past point at a wrong clock.

  - name: read replica lagging for five minutes
    interval: 1m
    input_series:
      - series: 'onlineorder_db_replica_lag_seconds{application="OnlineOrder", instance="app:8081", replica="replica-1"}'
        values: '0.1x4 12x10'
      - series: 'onlineorder_db_replica_routable{application="OnlineOrder", instance="app:8081", replica="replica-1"}'
        values: '1x4 0x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: OnlineOrderDbReplicaLagging
        exp_alerts: []
      - eval_time: 10m
        alertname: OnlineOrderDbReplicaLagging
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: app:8081
              replica: replica-1
            exp_annotations:
              summary: Read replica replica-1 is behind the primary on app:8081
              description: 'replica-1 has been more than 2s behind the primary for 5 minutes (12s now) and gets no reads. Check its replay (pg_stat_replication on the primary, long queries or I/O on the replica).'
      - eval_time: 10m
        alertname: OnlineOrderDbReplicaUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: app:8081
              replica: replica-1
            exp_annotations:
              summary: Read replica replica-1 gets no reads on app:8081
              description: For 5 minutes replica-1 has been lagging, unreachable or not a standby (the instance logs "Read replica ... gets no reads" with the reason). Its reads go to the primary.

  # An unreachable replica cannot be measured: its lag is NaN, so only the routable alert fires.
  - name: read replica unreachable
    interval: 1m
    input_series:
      - series: 'onlineorder_db_replica_lag_seconds{application="OnlineOrder", instance="app:8081", replica="replica-1"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'onlineorder_db_replica_routable{application="OnlineOrder", instance="app:8081", replica="replica-1"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: OnlineOrderDbReplicaUnavailable
        exp_alerts: []
      - eval_time: 8m
        alertname: OnlineOrderDbReplicaLagging
        exp_alerts: []
      - eval_time: 8m
        alertname: OnlineOrderDbReplicaUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: app:8081
              replica: replica-1
            exp_annotations:
              summary: Read replica replica-1 gets no reads on app:8081
              description: For 5 minutes replica-1 has been lagging, unreachable or not a standby (the instance logs "Read replica ... gets no reads" with the reason). Its reads go to the primary.

  - name: a healthy read replica raises nothing
    interval: 1m
    input_series:
      - series: 'onlineorder_db_replica_lag_seconds{application="OnlineOrder", instance="app:8081", replica="replica-1"}'
        values: '0.05x20'
      - series: 'onlineorder_db_replica_routable{application="OnlineOrder", instance="app:8081", replica="replica-1"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: OnlineOrderDbReplicaLagging
        exp_alerts: []
      - eval_time: 20m
        alertname: OnlineOrderDbReplicaUnavailable
        exp_alerts: []

  # onlineorder.aftersales.refunds{outcome="failed"} is registered by the first refund given up, so it starts at 1;
  # the other outcomes never raise the alert.
  - name: first refund given up after a start
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_refunds_total{application="OnlineOrder", instance="app:8081", outcome="succeeded"}'
        values: '1+2x30'
      - series: 'onlineorder_aftersales_refunds_total{application="OnlineOrder", instance="app:8081", outcome="retried"}'
        values: '1+1x30'
      - series: 'onlineorder_aftersales_refunds_total{application="OnlineOrder", instance="app:8081", outcome="failed"}'
        values: '_x5 1x25'
    alert_rule_test:
      - eval_time: 4m
        alertname: OnlineOrderRefundsGivenUp
        exp_alerts: []
      - eval_time: 7m
        alertname: OnlineOrderRefundsGivenUp
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: After-sales refunds were given up
              description: Refunds reached FAILED in the last 15 minutes and their customers are not refunded. List them with GET /admin/refunds (FAILED by default), read last_error, fix the cause, then retry with POST /admin/refunds/{id}/retry. A refund that does not match its case or payment fails the same way again (docs/operations.md section 12).
      # Resolves once the window no longer holds the failure; the refund itself stays FAILED until retried.
      - eval_time: 25m
        alertname: OnlineOrderRefundsGivenUp
        exp_alerts: []

  - name: later refund given up on an existing series
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_refunds_total{application="OnlineOrder", instance="app:8081", outcome="failed"}'
        values: '1x24 2x10'
    alert_rule_test:
      - eval_time: 20m
        alertname: OnlineOrderRefundsGivenUp
        exp_alerts: []
      - eval_time: 27m
        alertname: OnlineOrderRefundsGivenUp
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: After-sales refunds were given up
              description: Refunds reached FAILED in the last 15 minutes and their customers are not refunded. List them with GET /admin/refunds (FAILED by default), read last_error, fix the cause, then retry with POST /admin/refunds/{id}/retry. A refund that does not match its case or payment fails the same way again (docs/operations.md section 12).

  # Refund claims keep failing, one back-off every ~10s, from minute 5 to minute 35, then the cause is fixed.
  - name: refund claims backing off for 15 minutes
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_refunds_total{application="OnlineOrder", instance="app:8081", outcome="backed_off"}'
        values: '_x5 1+6x30 181x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: OnlineOrderRefundsBackingOff
        exp_alerts: []
      - eval_time: 25m
        alertname: OnlineOrderRefundsBackingOff
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: After-sales refund claims keep failing
              description: '30 refund claim(s) failed and backed off in the last 5 minutes, and claims have kept failing for 15 minutes. These refunds wait without using up attempts; one is given up (FAILED) once 10 of its claims failed in a row. Find them with GET /admin/refunds?status=PENDING or status=PROCESSING (last_error "The claim of attempt ... failed") and the WARN log "The claim of refund ... failed" (docs/operations.md section 12).'
      - eval_time: 45m
        alertname: OnlineOrderRefundsBackingOff
        exp_alerts: []

  # A database blip: a few claims back off, then the refunds go through.
  - name: a short burst of refund back-offs raises nothing
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_refunds_total{application="OnlineOrder", instance="app:8081", outcome="backed_off"}'
        values: '_x5 1 4 6x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: OnlineOrderRefundsBackingOff
        exp_alerts: []
      - eval_time: 30m
        alertname: OnlineOrderRefundsBackingOff
        exp_alerts: []

  # The gateway hangs from minute 5 to minute 30: every poller run (one a second) finds no free thread.
  - name: refund gateway threads held for 10 minutes
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_refund_gateway_saturated_total{application="OnlineOrder", instance="app:8081"}'
        values: '0x5 60+60x25 1560x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: OnlineOrderRefundGatewaySaturated
        exp_alerts: []
      - eval_time: 20m
        alertname: OnlineOrderRefundGatewaySaturated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Refund gateway threads are all held by hung calls
              description: 'No refund was claimed in 300 poller run(s) of the last 5 minutes because every refund gateway thread is held by a call that did not return within its timeout, and this has lasted 10 minutes. Due refunds wait without using up attempts. Check the payment gateway; onlineorder_aftersales_refund_gateway_threads_busy shows the held threads (docs/operations.md section 12, "A hung gateway").'
      - eval_time: 40m
        alertname: OnlineOrderRefundGatewaySaturated
        exp_alerts: []

  # Two minutes of held threads, then the gateway answers again.
  - name: a short refund gateway stall raises nothing
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_refund_gateway_saturated_total{application="OnlineOrder", instance="app:8081"}'
        values: '0x5 60 120x30'
    alert_rule_test:
      - eval_time: 8m
        alertname: OnlineOrderRefundGatewaySaturated
        exp_alerts: []
      - eval_time: 20m
        alertname: OnlineOrderRefundGatewaySaturated
        exp_alerts: []

  # One case's deadline keeps rolling back, retried every 30s, from minute 5 to minute 35, then the cause is fixed.
  - name: after-sales deadlines failing for 15 minutes
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_deadlines_total{application="OnlineOrder", instance="app:8081", trigger="merchant_timeout", outcome="failed"}'
        values: '_x5 1+2x30 61x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: OnlineOrderAfterSalesDeadlinesFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: OnlineOrderAfterSalesDeadlinesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: After-sales deadlines keep failing to fire
              description: '10 after-sales deadline(s) failed and backed off in the last 5 minutes, and deadlines have kept failing for 15 minutes. Their cases stay in their status past the deadline, and the customer''s and the merchant''s answers are refused meanwhile. The WARN log "After-sales deadline ... failed (attempt N)" names the cases; the overdue cases query is in docs/operations.md section 12, "Deadlines".'
      - eval_time: 45m
        alertname: OnlineOrderAfterSalesDeadlinesFailing
        exp_alerts: []

  # A lock timeout: two deadlines back off once, then fire.
  - name: a short burst of failed deadlines raises nothing
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_deadlines_total{application="OnlineOrder", instance="app:8081", trigger="merchant_timeout", outcome="failed"}'
        values: '_x5 1 3 4x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: OnlineOrderAfterSalesDeadlinesFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: OnlineOrderAfterSalesDeadlinesFailing
        exp_alerts: []

  # onlineorder.aftersales.cancellations.undercaptured has no tags and is registered by the first such cancellation.
  - name: first undercaptured cancellation after a start
    interval: 1m
    input_series:
      - series: 'onlineorder_aftersales_cancellations_undercaptured_total{application="OnlineOrder", instance="app:8081"}'
        values: '_ _ 1x25'
    alert_rule_test:
      - eval_time: 1m
        alertname: OnlineOrderCancellationsUndercaptured
        exp_alerts: []
      - eval_time: 4m
        alertname: OnlineOrderCancellationsUndercaptured
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Paid orders were cancelled with less captured than their refund
              description: The automatic refund of these cancellations will be given up before the gateway is called, and an admin retry fails the same way. The WARN log "Order ... was cancelled with a refund of ..." names the order, the payment and the case; support refunds them by hand (docs/operations.md section 12).
      - eval_time: 20m
        alertname: OnlineOrderCancellationsUndercaptured
        exp_alerts: []

  # Redis stops answering the bucket checks from minute 5 to minute 30: every rate-limited request fails open. Each
  # route's series is registered by its first failure, at 1, so the half-minutes count from 6m and the eighth is 9m30s.
  - name: a sustained rate limiter outage fires
    interval: 1m
    input_series:
      - series: 'onlineorder_security_rate_limit_store_failure_total{application="OnlineOrder", instance="app:8081", route="cart"}'
        values: '_x5 1+20x25 501x20'
      - series: 'onlineorder_security_rate_limit_store_failure_total{application="OnlineOrder", instance="app:8081", route="login"}'
        values: '_x5 1+10x25 251x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
      - eval_time: 15m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The rate limiter is failing open
              description: 'The rate-limit store (Redis) failed bucket checks in 19 of the last 20 half-minutes (8 raise this alert), and the rate-limited requests whose check failed went through unchecked; when every check fails no bucket refuses anything (docs/correctness.md "Security and Abuse Controls"). Check that the instances reach Redis, its latency and memory, and that it accepts EVAL; the WARN log "Rate-limit store unavailable for route ... Failing open." has the cause and onlineorder_security_rate_limit_store_failure_total{route} the routes.'
      # The last failure is at 30m; its half-minutes leave the 10m window by 37m.
      - eval_time: 40m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []

  # Redis is down from minute 5 but traffic is sparse: one rate-limited request every 3 minutes, each failing open (10s
  # scrapes). A `for` on increase(...[2m]) > 0 would restart at every 3-minute gap and never fire; here each failure
  # counts in 4 half-minutes, and with the failures at 8m and 11m the eighth is 12m30s. The last failure is at 26m, and
  # fewer than 8 of its window's half-minutes count from 33m.
  - name: sparse failing requests fire
    interval: 10s
    input_series:
      - series: 'onlineorder_security_rate_limit_store_failure_total{application="OnlineOrder", instance="app:8081", route="login"}'
        values: '_x30 1x17 2x17 3x17 4x17 5x17 6x17 7x17 8x17 8x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
      - eval_time: 13m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The rate limiter is failing open
              description: 'The rate-limit store (Redis) failed bucket checks in 8 of the last 20 half-minutes (8 raise this alert), and the rate-limited requests whose check failed went through unchecked; when every check fails no bucket refuses anything (docs/correctness.md "Security and Abuse Controls"). Check that the instances reach Redis, its latency and memory, and that it accepts EVAL; the WARN log "Rate-limit store unavailable for route ... Failing open." has the cause and onlineorder_security_rate_limit_store_failure_total{route} the routes.'
      - eval_time: 20m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The rate limiter is failing open
              description: 'The rate-limit store (Redis) failed bucket checks in 13 of the last 20 half-minutes (8 raise this alert), and the rate-limited requests whose check failed went through unchecked; when every check fails no bucket refuses anything (docs/correctness.md "Security and Abuse Controls"). Check that the instances reach Redis, its latency and memory, and that it accepts EVAL; the WARN log "Rate-limit store unavailable for route ... Failing open." has the cause and onlineorder_security_rate_limit_store_failure_total{route} the routes.'
      - eval_time: 35m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []

  # A Redis blip: three requests fail open within a minute, then the buckets work again. Ranges are left-open (t-2m,
  # t], so only the half-minutes at 6m and 6m30s see the rise: 2 of 20. The checks fail when the `>= 8` guard is
  # removed (the count is then an alert of its own from 6m to 16m).
  - name: a short rate limiter blip raises nothing
    interval: 1m
    input_series:
      - series: 'onlineorder_security_rate_limit_store_failure_total{application="OnlineOrder", instance="app:8081", route="cart"}'
        values: '_x5 1 3x30'
    alert_rule_test:
      - eval_time: 6m30s
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
      - eval_time: 10m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
      - eval_time: 20m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []

  # Redis gone for a minute at the scrape interval of deploy/observability (10s): failures in 7 scrapes, seen by the
  # half-minutes from 5m30s to 7m30s: 5 of 20.
  - name: a Redis outage of a minute raises nothing
    interval: 10s
    input_series:
      - series: 'onlineorder_security_rate_limit_store_failure_total{application="OnlineOrder", instance="app:8081", route="cart"}'
        values: '_x30 1 20 40 60 80 100 120 120x150'
    alert_rule_test:
      - eval_time: 8m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
      - eval_time: 10m30s
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
      - eval_time: 15m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []

  # Failures from before the range leave a flat counter; refusals (429) are the limiter working, not failing.
  - name: a flat store failure counter raises nothing
    interval: 1m
    input_series:
      - series: 'onlineorder_security_rate_limit_store_failure_total{application="OnlineOrder", instance="app:8081", route="login"}'
        values: '4x40'
      - series: 'onlineorder_security_rate_limit_rejected_total{application="OnlineOrder", instance="app:8081", route="login"}'
        values: '1+30x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
      - eval_time: 40m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []

  # No store failure since the start: the counter has no series at all.
  - name: an absent store failure counter raises nothing
    interval: 1m
    input_series:
      - series: 'onlineorder_security_rate_limit_rejected_total{application="OnlineOrder", instance="app:8081", route="signup"}'
        values: '1+5x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
      - eval_time: 40m
        alertname: OnlineOrderRateLimiterFailingOpen
        exp_alerts: []
