apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onlineorder
  labels:
    app.kubernetes.io/name: onlineorder
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - onlineorder.example.com
      secretName: onlineorder-tls
  rules:
    - host: onlineorder.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onlineorder
                port:
                  name: http
