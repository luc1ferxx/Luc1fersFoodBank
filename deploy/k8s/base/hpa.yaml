apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: onlineorder
  labels:
    app.kubernetes.io/name: onlineorder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onlineorder
  # Each replica holds up to DATABASE_POOL_MAX_SIZE (30) PostgreSQL connections: keep
  # maxReplicas x 30 below the database's max_connections.
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
