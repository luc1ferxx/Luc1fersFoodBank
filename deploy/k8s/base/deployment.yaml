apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlineorder
  labels:
    app.kubernetes.io/name: onlineorder
    app.kubernetes.io/component: api
spec:
  # No replicas field: the HorizontalPodAutoscaler owns the replica count, so re-applying does not reset it.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: onlineorder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onlineorder
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: onlineorder
      automountServiceAccountToken: false
      # preStop sleep (10s) + Spring graceful shutdown (SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=30s) + margin.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: onlineorder
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: onlineorder
      containers:
        - name: onlineorder
          image: onlineorder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: onlineorder-config
            # DATABASE_USERNAME, DATABASE_PASSWORD and any Redis/Kafka credentials; created out of band.
            - secretRef:
                name: onlineorder-secrets
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Flyway migrations run before the context is ready; allow up to 3 minutes for the first start.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # readinessState + db + redis (management.endpoint.health.group.readiness).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Keeps serving while the endpoint removal reaches kube-proxy and the Ingress, then SIGTERM starts
            # Spring's graceful shutdown.
            preStop:
              exec:
                command: ["sleep", "10"]
          volumeMounts:
            # Tomcat work directories and JVM temp files; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
