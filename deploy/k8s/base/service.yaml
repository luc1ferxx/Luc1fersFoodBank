apiVersion: v1
kind: Service
metadata:
  name: onlineorder
  labels:
    app.kubernetes.io/name: onlineorder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: onlineorder
  # Only the application port. The management port (8081) is scraped per pod and never routed.
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
