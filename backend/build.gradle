import org.gradle.internal.os.OperatingSystem

import java.math.RoundingMode

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.13'
}


group = 'com.laioffer'
version = '0.0.1-SNAPSHOT'
description = 'OnlineOrder'


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


repositories {
    mavenCentral()
}


// Security patches above the versions Spring Boot 4.1.1 manages, for fixable HIGH/CRITICAL findings of the release
// image scan (Trivy, 2026-10-16). Remove an entry once Spring Boot manages that version or a later one; left in place
// it would pin the older version.
// Tomcat 11.0.24: CVE-2026-65182, CVE-2026-65905, CVE-2026-68525 (CRITICAL), fixed in 11.0.25.
ext['tomcat.version'] = '11.0.27'
// Jackson 3.1.5: CVE-2026-89407, CVE-2026-89425 (jackson-core), CVE-2026-68497, CVE-2026-91776, CVE-2026-91777
// (jackson-databind), fixed in 3.1.7.
ext['jackson-bom.version'] = '3.1.7'
// The same CVEs in Jackson 2 (fixed in 2.21.7; Spring Boot 4.1.1 manages 2.21.5). Jackson 2 is no longer the
// application's JSON library, but springdoc's swagger-core still brings it onto the runtime classpath.
ext['jackson-2-bom.version'] = '2.21.7'

// Not a security patch: H2 2.4.240 (managed by Spring Boot 4.1.1) loses CHECK (... IN (...)) constraints once the
// connection that created them is closed ("Check constraint invalid ... The database has been closed"). Flyway
// migrates over its own connection, so under the h2 profile every insert into orders, idempotency_requests and the
// other tables with such a constraint failed. 2.3.232 is the version Spring Boot 3.5 used; drop this once an H2
// release fixes it (H2CartCheckoutIntegrationTests shows it).
ext['h2.version'] = '2.3.232'

dependencyManagement {
    dependencies {
        // LZ4 codec of kafka-clients (CVE-2026-106451, fixed in 1.11.4); kafka-clients 4.2.1 still asks for 1.10.1.
        dependency 'at.yawk.lz4:lz4-java:1.12.0'
    }
}


def frontendDir = file("${rootDir}/../frontend")
def frontendBuildDir = file("${frontendDir}/build")
def generatedFrontendResourcesDir = layout.buildDirectory.dir('generated/frontend-public')


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation('org.springframework.boot:spring-boot-starter-opentelemetry') {
        // Tracing only: metrics stay on the Prometheus scrape, so the OTLP metrics registry the starter adds is left
        // out (it would push every meter to the collector as well).
        exclude group: 'io.micrometer', module: 'micrometer-registry-otlp'
    }
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // Event contracts (JSON Schema draft 2020-12, see docs/correctness.md "Event contracts"). 3.x is the line built on
    // Jackson 3 (tools.jackson); 3.0.6 is the newest release compiled against Jackson 3.1, the minor line Spring Boot
    // 4.1 manages (3.0.7+ target 3.2). Schemas are JSON only, so the YAML reader and its snakeyaml-engine stay off the
    // classpath.
    implementation('com.networknt:json-schema-validator:3.0.6') {
        exclude group: 'tools.jackson.dataformat', module: 'jackson-dataformat-yaml'
    }
    // H2 plus its web console (the h2 profile enables it at /h2-console).
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql:42.7.14'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-micrometer-metrics-test'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-micrometer-tracing-test'
    testImplementation 'io.micrometer:micrometer-tracing-bridge-otel'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


// CI runs the classes on several runners (.github/workflows/ci.yml): -PtestShard=i/N runs the i-th (from 1) of N slices
// of the compiled top-level test classes (nested classes with their outer class), balanced by the durations measured
// in config/test-durations.properties. scripts/test-durations.py rebuilds that file from a green run's JUnit XML; it is
// refreshed occasionally, not per pull request (docs/operations.md section 5), and TestDurationsFileTests fails when
// it names a class that is gone. Every class is in exactly one slice, whether or not the file knows it; the slices'
// JaCoCo files are merged by the report tasks below, and testShardPlan prints the plan without running anything.
def testDurationsFile = file('config/test-durations.properties')


// The fully qualified names of the compiled top-level test classes under the class directories, sorted.
def compiledTestClasses = { FileCollection classesDirs ->
    classesDirs.files.findAll { it.isDirectory() }.collectMany { dir ->
        project.fileTree(dir) { include '**/*.class'; exclude '**/*$*.class' }.files.collect { f ->
            (dir.toPath().relativize(f.toPath()).toString() - ~/\.class$/).replace(File.separator, '.')
        }
    }.sort()
}


// Plans count shards for the classes, deterministically for a class list and file: shards is one
// [seconds: BigDecimal, classes: List<String>] per shard. Greedy: the classes by measured duration descending (ties by
// name), each to the shard with the smallest total so far (ties: the lowest shard). A class the file does not name
// (unknown) gets fallback: the median of the known durations, or 1.0 when the file is missing or empty, which degrades
// the plan to the greedy order by name. The file lists the classes that reported tests, so abstract bases and test
// support classes, which run nothing, are planned at the median as well.
def planTestShards = { List<String> classes, int count ->
    def known = [:]
    if (testDurationsFile.isFile()) {
        testDurationsFile.eachLine('UTF-8') { line, number ->
            def entry = line.trim()
            if (entry && !entry.startsWith('#')) {
                def parts = entry.split('=', 2)
                def name = parts[0].trim()
                def value = parts.length == 2 ? parts[1].trim() : ''
                if (name.isEmpty() || name.contains('$') || !(value ==~ /\d+(\.\d+)?/)) {
                    throw new GradleException("${testDurationsFile}: line ${number} is not <top-level class>=<seconds>" +
                            " (refresh the file with scripts/test-durations.py): ${line}")
                }
                known[name] = new BigDecimal(value)
            }
        }
    }
    def durations = known.values().toSorted()
    def fallback = durations
            ? (durations[(durations.size() - 1).intdiv(2)] + durations[durations.size().intdiv(2)]) / 2
            : BigDecimal.ONE
    def shards = (1..count).collect { [seconds: BigDecimal.ZERO, classes: []] }
    classes.collect { name -> [name: name, seconds: known.getOrDefault(name, fallback)] }
            .sort { a, b -> b.seconds <=> a.seconds ?: a.name <=> b.name }
            .each { entry ->
                def shard = shards[0]
                shards.each { if (it.seconds < shard.seconds) shard = it }
                shard.classes << entry.name
                shard.seconds += entry.seconds
            }
    assert shards.sum { it.classes.size() } == classes.size()
    [shards: shards, unknown: classes.findAll { !known.containsKey(it) }, fallback: fallback]
}


def seconds = { BigDecimal value -> value.setScale(1, RoundingMode.HALF_UP) }


tasks.named('test') {
    useJUnitPlatform()
    // Spring caches one context per distinct test configuration (Testcontainers, Kafka and Redis clients included);
    // Gradle's 512 MB default ran out once the after-sales suites joined.
    maxHeapSize = '1g'
    // The test classes run in several JVMs at once. Each fork keeps its own Spring context cache and starts its own
    // containers (they are declared per class), so the fork count is bounded by the Docker host's memory, not by
    // CPUs: four forks hold up to about 4 GB of containers at their peak. Half the CPUs, at most 4 (2 on the 4-vCPU
    // CI runner); -PtestForks=N overrides it, and -PtestForks=1 runs the classes one after another.
    maxParallelForks = (findProperty('testForks')
            ?: Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))) as Integer
    // The server runs in UTC (OnlineOrderApplication.main sets it); tests do not run main, so their JVM starts in UTC.
    systemProperty 'user.timezone', 'UTC'
    // The CI shard (see planTestShards above): the plan is logged so the CI log shows the balance. The filter is set in
    // doFirst, which the up-to-date check cannot see, so the shard and the file are declared as inputs: a run without
    // a shard, or with another one, after a shard's run is never up to date.
    def shard = findProperty('testShard')
    inputs.property('testShard', shard ? shard.toString() : '')
    if (shard) {
        def (index, count) = shard.toString().split('/').collect { it as Integer }
        if (index < 1 || index > count) {
            throw new GradleException("testShard must be i/N with 1 <= i <= N, not ${shard}")
        }
        inputs.files(testDurationsFile).withPropertyName('testDurationsFile')
        doFirst {
            def plan = planTestShards(compiledTestClasses(testClassesDirs), count)
            plan.shards.eachWithIndex { s, i ->
                logger.lifecycle("Test shard ${i + 1}/${count}: planned ${seconds(s.seconds)} s, " +
                        "${s.classes.size()} classes")
            }
            if (plan.unknown) {
                logger.lifecycle("${plan.unknown.size()} classes are not in ${testDurationsFile.name}, planned at " +
                        "${seconds(plan.fallback)} s each: ${plan.unknown.join(', ')}")
            }
            def names = plan.shards[index - 1].classes
            logger.lifecycle("Running test shard ${index}/${count}: ${names.size()} classes")
            // The plan's include list is exact, and a slice may hold only abstract bases and support classes, which
            // run no test; with more shards than classes an empty filter would run every class instead of none.
            filter.failOnNoMatchingTests = false
            names.each { name ->
                filter.includeTestsMatching(name)
                filter.includeTestsMatching(name + '$*')
            }
            if (names.isEmpty()) {
                filter.includeTestsMatching('<none>')
            }
        }
    }
}


tasks.register('testShardPlan') {
    group = 'verification'
    description = 'Prints the CI test shard plan for -PtestShards=N (default 4) without running the tests.'
    dependsOn tasks.named('testClasses')
    def count = (findProperty('testShards') ?: 4) as Integer
    if (count < 1) {
        throw new GradleException("testShards must be at least 1, not ${count}")
    }
    doLast {
        def classes = compiledTestClasses(sourceSets.test.output.classesDirs)
        def plan = planTestShards(classes, count)
        println "${classes.size()} test classes in ${count} shards, balanced by ${testDurationsFile.name}" +
                " (${plan.unknown.size()} not in the file, planned at ${seconds(plan.fallback)} s each)"
        if (plan.unknown) {
            println "Not in the file: ${plan.unknown.join(', ')}"
        }
        plan.shards.eachWithIndex { s, i ->
            println "Shard ${i + 1}/${count}: planned ${seconds(s.seconds)} s, ${s.classes.size()} classes"
            s.classes.each { println "  ${it}" }
        }
    }
}


// bootRun and bootTestRun call main, which sets UTC anyway; the property makes the JVM start in it.
tasks.withType(org.springframework.boot.gradle.tasks.run.BootRun).configureEach {
    systemProperty 'user.timezone', 'UTC'
}


tasks.register('buildFrontend', Exec) {
    group = 'frontend'
    description = 'Builds the React frontend before packaging or running the backend.'
    workingDir frontendDir

    inputs.files(
            fileTree("${frontendDir}/src"),
            fileTree("${frontendDir}/public"),
            fileTree("${frontendDir}/scripts"),
            // Every env file Vite's loadEnv may read (.env, .env.local, .env.[mode], .env.[mode].local).
            fileTree(dir: frontendDir, include: '.env*'),
            "${frontendDir}/package.json",
            "${frontendDir}/package-lock.json",
            "${frontendDir}/index.html",
            "${frontendDir}/vite.config.ts",
            fileTree(dir: frontendDir, include: 'tsconfig*.json')
    )
    outputs.dir(frontendBuildDir)

    if (OperatingSystem.current().isWindows()) {
        commandLine 'cmd', '/c', 'npm run build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}


tasks.register('syncFrontendBuild', Sync) {
    group = 'frontend'
    description = 'Copies the built frontend into backend resources for serving.'
    dependsOn tasks.named('buildFrontend')
    from(frontendBuildDir)
    into(generatedFrontendResourcesDir)
}


tasks.named('processResources') {
    dependsOn tasks.named('syncFrontendBuild')
    exclude 'public/**'
    from(generatedFrontendResourcesDir) {
        into 'public'
    }
}


// Quality gates run by CI (see docs/operations.md). The coverage minimums sit just below the values
// measured with Docker available (2026-10: 88.6% of lines, 73.9% of branches), so the Testcontainers suites
// count; without Docker those suites skip and jacocoTestCoverageVerification fails. Raise them as coverage grows.
jacoco {
    toolVersion = '0.8.13'
}


// CI's coverage job downloads the test shards' JaCoCo files under build/jacoco/shards and reports them with
// -PjacocoShards. Without the property only the local test.exec counts, so a stale shards directory cannot inflate a
// local run's coverage.
def jacocoExecutionData = hasProperty('jacocoShards')
        ? fileTree(layout.buildDirectory.dir('jacoco/shards')) { include '**/*.exec' }
        : files()


tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    executionData.from(jacocoExecutionData)
    reports {
        xml.required = true
        html.required = true
    }
}


tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    executionData.from(jacocoExecutionData)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.87
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.72
            }
        }
    }
}


// SpotBugs scans production code only. config/spotbugs/exclude.xml is the accepted baseline: a global exclusion
// of EI_EXPOSE_REP/EI_EXPOSE_REP2 (Spring and record idioms) plus the findings reviewed when the gate was
// introduced. Any other new finding fails the build.
spotbugs {
    ignoreFailures = false
    excludeFilter = file('config/spotbugs/exclude.xml')
}


tasks.named('spotbugsTest') {
    enabled = false
}


// Spring Boot's dependency management would downgrade SpotBugs' own commons-lang3 to the Boot-managed
// version, which lacks classes SpotBugs needs; the tool classpath keeps the versions SpotBugs asks for.
configurations.named('spotbugs') {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
            details.useVersion(details.requested.version)
        }
    }
}


tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html {
            required = true
        }
        xml {
            required = true
        }
    }
}
