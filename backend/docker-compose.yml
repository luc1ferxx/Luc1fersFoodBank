services:


  db:
    image: postgres:15.19-alpine
    # The image's own client authentication rules plus streaming replication, for the optional replica below.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: onlineorder
      POSTGRES_PASSWORD: secret
    volumes:
      - onlineorder-pg-local:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "5433:5432"


  # Optional hot standby of db for read/write splitting (docs/operations.md "Read replicas"); not started by default.
  #   docker compose --profile replica up -d
  #   DATABASE_REPLICA_URLS=jdbc:postgresql://localhost:5434/onlineorder ./gradlew bootRun
  db-replica:
    image: postgres:15.19-alpine
    profiles: ["replica"]
    depends_on:
      - db
    user: postgres
    entrypoint: ["/bin/sh", "/usr/local/bin/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: db
      PGPASSWORD: secret
    volumes:
      - onlineorder-pg-replica-local:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    ports:
      - "5434:5432"


  redis:
    image: redis:7.4-alpine
    # Every key the app writes has a TTL (sessions 30m, cache entries 10m, rate-limit buckets 2m), so
    # volatile-lru evicts the least recently used of them when memory is full; the default noeviction
    # would instead reject session and rate-limit writes once maxmemory is reached.
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    volumes:
      - onlineorder-redis-local:/data
    ports:
      - "6379:6379"


  kafka:
    image: apache/kafka-native:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - onlineorder-kafka-local:/tmp/kraft-combined-logs
    ports:
      - "9092:9092"


volumes:
  onlineorder-pg-local:
  onlineorder-pg-replica-local:
  onlineorder-redis-local:
  onlineorder-kafka-local:
