# Client authentication of the local PostgreSQL in docker-compose.yml (and of the replication tests'
# primary, ReadReplicaRoutingIntegrationTests). The same rules the official image writes into a new data directory
# (trust on the container's own socket and loopback, a password from anywhere else), plus password-authenticated
# streaming replication from anywhere, which the optional read replica (compose profile "replica") needs. Mounted
# and passed as hba_file, so it also applies to a data volume created before it existed.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
