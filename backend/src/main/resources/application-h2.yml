spring:
  cache:
    type: redis
  datasource:
    # DB_CLOSE_DELAY=-1 is required for an in-memory URL: Flyway migrates over its own connection, and H2
    # would drop the database when that connection closes before the pool opens one.
    url: ${DATABASE_URL:jdbc:h2:mem:onlineorder-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    hikari:
      # H2's own session settings (milliseconds) instead of PostgreSQL's SET statement_timeout and
      # SET lock_timeout, with the same overrides as the default profile.
      connection-init-sql: "SET QUERY_TIMEOUT ${DATABASE_STATEMENT_TIMEOUT_MS:10000}; SET LOCK_TIMEOUT ${DATABASE_LOCK_TIMEOUT_MS:3000}"
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
  h2:
    console:
      enabled: true
      path: /h2-console
  session:
    store-type: none
  sql:
    init:
      mode: never

app:
  kafka:
    enabled: false
  cleanup:
    enabled: false
  outbox:
    publisher-enabled: false
  security:
    rate-limit:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
