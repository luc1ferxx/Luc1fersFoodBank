server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  # Anonymous menu and restaurant reads are served from the Redis cache without a database connection
  # (~15-20k req/s measured), so there are deliberately more request threads than the 30 Hikari
  # connections. DB-bound requests (cart, checkout, orders) wait on Hikari for at most
  # spring.datasource.hikari.connection-timeout and then fail fast with 503 instead of piling up.
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    # OS accept backlog used once max-connections are open.
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    # Time an accepted connection may take to send its request line; also the keep-alive idle timeout.
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:10s}
    # Spring Boot disables Tomcat's MBean registry by default; the tomcat.threads.* and tomcat.global.*
    # metrics are read from it.
    mbeanregistry:
      enabled: true

spring:
  application:
    name: OnlineOrder
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
    mapper:
      # Jackson 3 sorts properties alphabetically by default (record components keep their order either way, and
      # every DTO here is a record); declaration order keeps the JSON of any other type as Jackson 2 wrote it.
      sort-properties-alphabetically: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Idempotent producer: retries cannot duplicate or reorder records within a partition. Retries are
      # bounded by delivery.timeout.ms rather than a retry count.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Longest send() blocks waiting for metadata or buffer space.
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        linger.ms: ${KAFKA_PRODUCER_LINGER_MS:5}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        # Upper bound for reporting success or failure of a record after send() returns. Kafka requires
        # delivery.timeout.ms >= linger.ms + request.timeout.ms, and app.kafka.publish-timeout must stay
        # >= max.block.ms + this value so the outbox does not give up on a record the producer may still deliver.
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:onlineorder}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
      # Consumer spans continue the producer's trace from the record's traceparent header. TracingConfig applies
      # this and template.observation-enabled to every listener container factory and KafkaTemplate bean.
      observation-enabled: ${KAFKA_OBSERVATION_ENABLED:true}
    template:
      observation-enabled: ${KAFKA_OBSERVATION_ENABLED:true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Command timeout. Sessions, the cache (falls back to the database on errors) and rate limiting
      # (fails open) all call Redis on the request path, so a stalled Redis costs at most this per
      # command instead of holding a request thread for seconds.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5433}/onlineorder}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: onlineorder-db
      # Fixed-size pool: minimum-idle is left unset, as HikariCP recommends. Load test on one 15-core
      # machine: 10 connections gave ~750 orders/s with 182 requests waiting for a connection, 30 gave
      # ~1000 orders/s. Kafka listeners, the outbox publisher and cleanup share this pool. Keep
      # maximum-pool-size x instances below PostgreSQL max_connections (default 100).
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:30}
      # Milliseconds: HikariCP takes plain longs here and duration strings such as 2s do not bind.
      # A request that cannot get a connection in time fails fast with 503 SERVICE_UNAVAILABLE.
      connection-timeout: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:2000}
      # Milliseconds; kept below connection-timeout so a dead-connection check cannot outlast it.
      validation-timeout: ${DATABASE_POOL_VALIDATION_TIMEOUT_MS:1000}
      # Runs once on every new pooled connection. Unitless values are milliseconds in PostgreSQL. Kept out
      # of the JDBC URL because DATABASE_URL can be overridden. Flyway does not use the pool (see
      # spring.flyway.user), so migrations are not bound by these request-path timeouts. The h2 profile
      # overrides this with H2's own settings.
      connection-init-sql: "SET statement_timeout = ${DATABASE_STATEMENT_TIMEOUT_MS:10000}; SET lock_timeout = ${DATABASE_LOCK_TIMEOUT_MS:3000}"
  h2:
    console:
      enabled: false
      path: /h2-console
  sql:
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    # Setting the user makes Boot give Flyway its own unpooled connections, derived from the application
    # DataSource (same URL and password), so migrations do not run with the pool's statement_timeout and
    # lock_timeout. SET LOCAL could not raise them for non-transactional migrations such as
    # CREATE INDEX CONCURRENTLY.
    user: ${spring.datasource.username}
  session:
    store-type: redis
    data:
      redis:
        # The suffix versions the stored session format (JDK-serialized SecurityContext), like the catalog cache
        # keys: pods of two releases share Redis during a rolling update or a rollback, and a pod that reads a
        # session holding a class it lacks answers every request carrying it with an HTML 500. v2 = Spring
        # Security 7 (FactorGrantedAuthority, unknown to Spring Boot 3.5). Bump it when RedisSessionFormatTests
        # reports a change. REDIS_SESSION_NAMESPACE replaces only the prefix.
        namespace: ${REDIS_SESSION_NAMESPACE:onlineorder:session}:v2
  cache:
    type: redis
    redis:
      cache-null-values: false
      time-to-live: ${REDIS_CACHE_TTL:10m}
  task:
    scheduling:
      # Spring's default scheduler has a single thread, so the hourly MaintenanceCleanupService run could
      # block the outbox publisher. A fixed-delay job never overlaps itself, so extra threads only let
      # different jobs run side by side.
      pool:
        size: ${TASK_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: scheduling-

app:
  # Read/write splitting (docs/operations.md "Read replicas"). Off unless replica URLs are given: then
  # @Transactional(readOnly = true) service methods read a PostgreSQL streaming replica and everything else, including
  # every statement outside a transaction, uses the primary pool above (spring.datasource.*).
  datasource:
    replica:
      # Comma-separated JDBC URLs of hot standbys of the primary (a URL that itself has commas goes in
      # APP_DATASOURCE_REPLICA_URLS_0, _1, ...). Credentials default to the primary's.
      urls: ${DATABASE_REPLICA_URLS:}
      username: ${DATABASE_REPLICA_USERNAME:${spring.datasource.username}}
      password: ${DATABASE_REPLICA_PASSWORD:${spring.datasource.password}}
      pool:
        # Per replica and instance, on top of the primary's DATABASE_POOL_MAX_SIZE.
        maximum-size: ${DATABASE_REPLICA_POOL_MAX_SIZE:20}
        # A read that waits this long for a replica connection runs on the primary instead.
        connection-timeout: ${DATABASE_REPLICA_POOL_CONNECTION_TIMEOUT:1s}
        # Bounds one network read on a replica (a hung replica); above DATABASE_STATEMENT_TIMEOUT_MS.
        socket-timeout: ${DATABASE_REPLICA_SOCKET_TIMEOUT:15s}
      # After a session commits a write, its reads use the primary this long (read-your-writes). Keep it above
      # max-lag, with a margin for clock differences between instances.
      sticky-window: ${DATABASE_REPLICA_STICKY_WINDOW:5s}
      # A replica gets reads only while its data is less than this old (a deadline checked at routing time, so it
      # holds even when the monitor is slow): the most a replica read can lag behind the primary.
      max-lag: ${DATABASE_REPLICA_MAX_LAG:2s}
      # Each replica is checked this often on a thread of its own. Keep it below max-lag / 2: a replica under write
      # load stays routable while it replays less than max-lag - 2 x this behind.
      lag-check-interval: ${DATABASE_REPLICA_LAG_CHECK_INTERVAL:500ms}
      # Connect and socket timeout of the lag monitor's own connections (whole seconds).
      lag-check-timeout: ${DATABASE_REPLICA_LAG_CHECK_TIMEOUT:1s}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    order-topic: ${KAFKA_ORDER_TOPIC:order-events}
    order-dlt-topic: ${KAFKA_ORDER_DLT_TOPIC:order-events.dlt}
    order-dlt-group: ${KAFKA_ORDER_DLT_GROUP:onlineorder-dlt}
    partitions: ${KAFKA_ORDER_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_ORDER_TOPIC_REPLICAS:1}
    # Batch-wide deadline for the outbox publisher's Kafka acks; must stay >= the producer's
    # max.block.ms + delivery.timeout.ms (5s + 10s), and below app.outbox.claim-timeout.
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:15s}
    # One consumer thread per partition for the order topic and its DLT; extra threads would sit idle.
    listener-concurrency: ${KAFKA_LISTENER_CONCURRENCY:${KAFKA_ORDER_TOPIC_PARTITIONS:3}}
    listener-retries: ${KAFKA_LISTENER_RETRIES:3}
    listener-backoff: ${KAFKA_LISTENER_BACKOFF:1s}
    # Transient database failures (no pooled connection within the 2s connection-timeout, lock or statement
    # timeouts) would exhaust listener-retries after ~11s of pool saturation and dead-letter the event. They
    # are retried instead with a backoff growing from listener-backoff to listener-transient-backoff-max until
    # listener-transient-retry-timeout has been spent waiting. KAFKA_LISTENER_RETRIES=0 turns off these retries too.
    # The consumer sleeps between attempts, so the backoff must stay well below max.poll.interval.ms (5m).
    listener-transient-backoff-max: ${KAFKA_LISTENER_TRANSIENT_BACKOFF_MAX:30s}
    listener-transient-retry-timeout: ${KAFKA_LISTENER_TRANSIENT_RETRY_TIMEOUT:5m}
    dlt-listener-backoff-initial: ${KAFKA_DLT_LISTENER_BACKOFF_INITIAL:1s}
    dlt-listener-backoff-max: ${KAFKA_DLT_LISTENER_BACKOFF_MAX:30s}
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:${KAFKA_ENABLED:true}}
    # 20 events every 3s capped the relay at ~6.7 events/s: after 166k orders 164k events were still
    # PENDING (~7 hours to drain).
    batch-size: ${OUTBOX_BATCH_SIZE:200}
    publish-interval: ${OUTBOX_PUBLISH_INTERVAL:500ms}
    # Lease on claimed events; longer than app.kafka.publish-timeout so a batch that is still being
    # published is not claimed again.
    claim-timeout: ${OUTBOX_CLAIM_TIMEOUT:30s}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    # Upper bound for the retry backoff after a failed publish.
    failure-backoff-max: ${OUTBOX_FAILURE_BACKOFF_MAX:60s}
  dlt:
    replay-timeout: ${DLT_REPLAY_TIMEOUT:5s}
    # A replay claim (REPLAYING) that was never resolved, because the process died or the database was
    # unreachable after the send, can be claimed again once it is this old. Must exceed the longest
    # possible send: the producer's max.block.ms (5s) plus replay-timeout.
    replay-claim-timeout: ${DLT_REPLAY_CLAIM_TIMEOUT:30s}
  # Event-driven order fulfilment (merchant, timeout, dispatch modules); see README "Order fulfilment".
  # Each module consumes with its own consumer group, so each sees every event once.
  fulfilment:
    # Delivery events published by the dispatch module (same partition count as the order topic).
    delivery-topic: ${KAFKA_DELIVERY_TOPIC:delivery-events}
    # Merchant events (merchant.order_received) published by the merchant module, consumed by the timeout module.
    merchant-topic: ${KAFKA_MERCHANT_TOPIC:merchant-events}
    merchant-group: ${FULFILMENT_MERCHANT_GROUP:onlineorder-merchant}
    timeout-group: ${FULFILMENT_TIMEOUT_GROUP:onlineorder-timeout}
    timeout-merchant-group: ${FULFILMENT_TIMEOUT_MERCHANT_GROUP:onlineorder-timeout-merchant}
    dispatch-group: ${FULFILMENT_DISPATCH_GROUP:onlineorder-dispatch}
    order-delivery-group: ${FULFILMENT_ORDER_DELIVERY_GROUP:onlineorder-order-delivery}
    notification-delivery-group: ${FULFILMENT_NOTIFICATION_DELIVERY_GROUP:onlineorder-notification-delivery}
    # A PAID order the merchant has not accepted within accept-timeout of payment is cancelled (MERCHANT_TIMEOUT);
    # a PLACED order not paid within payment-timeout is cancelled (PAYMENT_TIMEOUT). Measured from the event time;
    # a changed value applies to orders paid or placed after the change.
    accept-timeout: ${FULFILMENT_ACCEPT_TIMEOUT:10m}
    payment-timeout: ${FULFILMENT_PAYMENT_TIMEOUT:15m}
    # Only orders of a staffed restaurant (at least one active merchant account when the merchant inbox received the
    # order) get an accept deadline; a restaurant without staff never gets its paid orders auto-cancelled. Switching it
    # off also drops pending ACCEPT deadlines without cancelling.
    accept-timeout-enabled: ${FULFILMENT_ACCEPT_TIMEOUT_ENABLED:true}
    # Consumer threads per fulfilment listener (merchant, timeout, timeout-merchant, dispatch, order-delivery,
    # notification-delivery) and per after-sales listener (merchant-aftersales, aftersales-notification). With Kafka on
    # there are 10 listener containers (these 8, notifications, the DLT), 30 consumer threads at the default of 3; each
    # consumer thread holds a pooled database connection only while it handles a record, but all of them share the
    # Hikari pool above.
    listener-concurrency: ${FULFILMENT_LISTENER_CONCURRENCY:${app.kafka.listener-concurrency}}
    deadline-poller:
      # Runs on its own thread, not on the shared scheduler the outbox publisher uses. Off wherever Kafka is off
      # (nothing writes deadlines then).
      enabled: ${FULFILMENT_DEADLINE_POLLER_ENABLED:${app.kafka.enabled:true}}
      interval: ${FULFILMENT_DEADLINE_POLL_INTERVAL:1s}
      # Deadlines fired per run, one transaction each.
      batch-size: ${FULFILMENT_DEADLINE_BATCH_SIZE:100}
      # Delay before a deadline whose firing failed (for example a lock timeout) is tried again.
      retry-backoff: ${FULFILMENT_DEADLINE_RETRY_BACKOFF:30s}
  # After-sales refunds (com.laioffer.onlineorder.aftersales, docs/adr/0002-after-sales-state-machine.md).
  after-sales:
    # After-sales events (aftersales.*) published by the after-sales module, keyed by the order id (same partition
    # count as the order topic).
    topic: ${KAFKA_AFTER_SALES_TOPIC:after-sales-events}
    # The merchant module's consumer group on it: builds the merchant's after-sales inbox (merchant_after_sales_cases).
    merchant-group: ${AFTER_SALES_MERCHANT_GROUP:onlineorder-merchant-aftersales}
    # A customer can ask for a refund until request-window after the order completed (orders.updated_at), a second
    # time only after withdrawing the first and within the same window. Each open step waits for its answer until a
    # deadline set when the case enters it: the merchant's answer (merchant-response-timeout), the customer's answer to
    # a counter-offer or a rejection (customer-response-timeout) and the platform's arbitration (arbitration-timeout).
    # A changed value applies to the steps taken after the change.
    request-window: ${AFTER_SALES_REQUEST_WINDOW:24h}
    merchant-response-timeout: ${AFTER_SALES_MERCHANT_RESPONSE_TIMEOUT:24h}
    customer-response-timeout: ${AFTER_SALES_CUSTOMER_RESPONSE_TIMEOUT:48h}
    arbitration-timeout: ${AFTER_SALES_ARBITRATION_TIMEOUT:72h}
    poller:
      # Fires the deadlines of the open cases, then executes the due refunds
      # (com.laioffer.onlineorder.aftersales.AfterSalesPoller), on its own thread, not on the shared scheduler the
      # outbox publisher uses. Follows Kafka like the fulfilment deadline poller; set AFTER_SALES_POLLER_ENABLED=true
      # to run them in the h2 profile (the demo profile does).
      enabled: ${AFTER_SALES_POLLER_ENABLED:${app.kafka.enabled:true}}
      interval: ${AFTER_SALES_POLL_INTERVAL:1s}
      # Cases fired, and refunds executed, per run: one transaction each (a refund has two, around its gateway call).
      batch-size: ${AFTER_SALES_POLL_BATCH_SIZE:100}
      # Delay before a case whose deadline failed to fire (for example a lock timeout) is tried again. Its deadline_at
      # stays as it was, so the customer's and the merchant's answers stay refused meanwhile.
      retry-backoff: ${AFTER_SALES_DEADLINE_RETRY_BACKOFF:30s}
      # Time a tick may spend claiming work, shared by the deadlines and then the refunds; each stops claiming once it
      # is spent, after one case or refund at least, and a gateway call already started runs to its timeout. A slow or
      # hung refund gateway so delays the next tick's deadlines by about this plus refund-gateway.timeout at most.
      tick-budget: ${AFTER_SALES_POLL_TICK_BUDGET:5s}
    refund:
      # Gateway calls a refund may make (a reclaim after an expired lease counts as one) before it is given up
      # (FAILED, its case stays REFUNDING) for an admin to retry.
      max-attempts: ${AFTER_SALES_REFUND_MAX_ATTEMPTS:8}
      # Wait after a failed call: retry-backoff x 2^(attempts - 1), at most retry-backoff-max. A failed claim (its
      # transaction failed after the claim, before any call; outcome backed_off) waits retry-backoff as well, never
      # doubled, and uses up no attempt.
      retry-backoff: ${AFTER_SALES_REFUND_RETRY_BACKOFF:10s}
      retry-backoff-max: ${AFTER_SALES_REFUND_RETRY_BACKOFF_MAX:10m}
      # The lease of a claimed refund: when an executor died or stalled after its claim, another one reclaims the refund
      # after this long and calls the gateway again with the same key.
      claim-timeout: ${AFTER_SALES_REFUND_CLAIM_TIMEOUT:60s}
      # Claims of one refund that may fail in a row after the claim (outcome backed_off) before the last of them gives
      # the refund up (FAILED, no attempt used up) for an admin to retry, instead of backing it off forever. At least 1
      # (checked at startup); any other step of the refund starts the count over.
      max-claim-failures: ${AFTER_SALES_REFUND_MAX_CLAIM_FAILURES:10}
    refund-gateway:
      # How long a gateway call is waited for before it counts as a retryable failure; the call is then interrupted.
      # Must be shorter than refund.claim-timeout (checked at startup), so that no refund is reclaimed while the call
      # is still waited for. A call that ignores the interrupt may still be in flight when the refund is retried or,
      # once its lease ended, reclaimed: the gateway must be idempotent per gateway_key (one key per case, the same for
      # every attempt), which is what keeps a refund from being paid twice.
      timeout: ${AFTER_SALES_REFUND_GATEWAY_TIMEOUT:10s}
      # Gateway calls running at once at most, calls that outlived their timeout included. While all of them are held
      # by such calls no refund is claimed: a hung gateway ties up this many threads at most, and the refunds that
      # wait meanwhile use up no attempt.
      max-threads: ${AFTER_SALES_REFUND_GATEWAY_MAX_THREADS:4}
      # The simulated gateway fails the first N attempts of every refund (retryable), for demos and tests.
      fail-first-attempts: ${AFTER_SALES_REFUND_GATEWAY_FAIL_FIRST_ATTEMPTS:0}
    # Consumer group of the customer notifications for after-sales events (fulfilment.notification).
    notification-group: ${AFTER_SALES_NOTIFICATION_GROUP:onlineorder-aftersales-notification}
  cleanup:
    enabled: ${CLEANUP_ENABLED:true}
    fixed-delay-ms: ${CLEANUP_FIXED_DELAY_MS:3600000}
    initial-delay-ms: ${CLEANUP_INITIAL_DELAY_MS:300000}
    outbox-retention: ${CLEANUP_OUTBOX_RETENTION:7d}
    processed-event-retention: ${CLEANUP_PROCESSED_EVENT_RETENTION:14d}
    idempotency-retention: ${CLEANUP_IDEMPOTENCY_RETENTION:3d}
    dead-letter-retention: ${CLEANUP_DEAD_LETTER_RETENTION:30d}
    # Records to keep: 0d (default) keeps them forever. On PostgreSQL these two and processed_events are partitioned by
    # month (V10) and expire a whole month at a time (app.partitions); on H2 rows are deleted.
    audit-log-retention: ${CLEANUP_AUDIT_LOG_RETENTION:0d}
    order-status-history-retention: ${CLEANUP_ORDER_STATUS_HISTORY_RETENTION:0d}
    # Rows per DELETE statement; each statement must finish well within the pool's statement_timeout.
    batch-size: ${CLEANUP_BATCH_SIZE:5000}
  # Monthly partitions of audit_log, order_status_history and processed_events (PostgreSQL; docs/operations.md
  # section 9). The job creates the current month and months-ahead more, drops months older than the retentions above
  # when app.cleanup.enabled, and runs on one instance at a time (advisory lock).
  partitions:
    maintenance-enabled: ${PARTITIONS_MAINTENANCE_ENABLED:true}
    # At least 2; the OnlineOrderPartitionsAhead* alerts fire below 2 and at 0.
    months-ahead: ${PARTITIONS_MONTHS_AHEAD:3}
    fixed-delay-ms: ${PARTITIONS_FIXED_DELAY_MS:3600000}
    initial-delay-ms: ${PARTITIONS_INITIAL_DELAY_MS:60000}
    # Creating or dropping a partition locks the parent table for a moment; give up after this instead of queueing
    # inserts behind a long-running query.
    lock-timeout: ${PARTITIONS_LOCK_TIMEOUT:5s}
  # 64-bit Snowflake ids (public order numbers, orders.order_no): each running instance needs its own worker id
  # (0-1022). static: APP_IDS_WORKER_ID (default 0, one local instance); lease: leased from snowflake_worker_leases
  # (Kubernetes Deployment, PostgreSQL only). docs/operations.md section 8.
  ids:
    worker-id-source: ${APP_IDS_WORKER_ID_SOURCE:static}
    worker-id: ${APP_IDS_WORKER_ID:0}
    # A clock step back up to this is waited out; a larger one makes checkout answer 503 until the clock catches up.
    max-clock-backward: ${APP_IDS_MAX_CLOCK_BACKWARD:50ms}
    lease:
      ttl: ${APP_IDS_LEASE_TTL:60s}
      renew-interval: ${APP_IDS_LEASE_RENEW_INTERVAL:15s}
  # Two-level catalog cache (spring.cache.type=redis): Caffeine L1 per instance in front of Redis L2, with
  # Redis pub/sub dropping other instances' L1 copies on writes. The L2 base TTL is
  # spring.cache.redis.time-to-live. Redis keys: <key-namespace>:<version>:<cache>::<key>.
  cache:
    key-namespace: ${CACHE_KEY_NAMESPACE:onlineorder:cache}
    l1:
      # Upper bound for serving an entry whose invalidation message this instance missed.
      ttl: ${CACHE_L1_TTL:30s}
      menu-maximum-size: ${CACHE_L1_MENU_MAXIMUM_SIZE:10000}
    l2:
      # Each Redis write gets TTL * [1 - jitter, 1 + jitter] so entries loaded together do not expire together.
      ttl-jitter: ${CACHE_L2_TTL_JITTER:0.15}
      # After a Redis error or timeout (or 3 consecutive calls slower than slow-call-threshold), cache reads
      # and write-backs skip Redis for open-duration and go to L1 and the database; then one request probes
      # Redis again. A hung Redis then costs one spring.data.redis.timeout per open period instead of one or
      # two per L1 miss. Evictions always go to Redis. open-duration 0 disables the breaker.
      circuit-breaker:
        open-duration: ${CACHE_L2_CIRCUIT_OPEN_DURATION:5s}
        slow-call-threshold: ${CACHE_L2_SLOW_CALL_THRESHOLD:200ms}
    # Second eviction after an admin catalog write, for a reader that cached the old row right after the
    # first after-commit eviction. 0 disables it.
    delayed-double-delete: ${CACHE_DELAYED_DOUBLE_DELETE:1s}
  catalog:
    # Cache-Control max-age for GET /restaurants/menu and GET /restaurant/{id}/menu (both also send an ETag).
    http-max-age: ${CATALOG_HTTP_MAX_AGE:30s}
    # A restaurant id missing from the cached restaurant list is looked up in the database at most once per
    # interval per instance before the 404, so a restaurant created outside the admin API is served at once
    # while random ids still cannot hammer the database. 0 checks every unknown id.
    unknown-restaurant-recheck-interval: ${CATALOG_UNKNOWN_RESTAURANT_RECHECK_INTERVAL:1s}
  security:
    rate-limit:
      enabled: ${SECURITY_RATE_LIMIT_ENABLED:true}
      bucket-ttl: ${SECURITY_RATE_LIMIT_BUCKET_TTL:${SECURITY_RATE_LIMIT_WINDOW:2m}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
      group:
        liveness:
          include: ${MANAGEMENT_HEALTH_LIVENESS_INCLUDE:livenessState,ping}
        readiness:
          include: ${MANAGEMENT_HEALTH_READINESS_INCLUDE:readinessState,db,redis}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish histogram buckets so latency percentiles can be computed and aggregated in Prometheus.
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
      # Exact buckets at the thresholds that matter; 2s is the Hikari connection-timeout. The latency SLO alerts
      # in deploy/observability/prometheus/alerts.yml read the 500ms bucket.
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s
      # Bounds for the percentiles histogram, so each uri/method/status series carries about half the default
      # number of buckets (1ms-30s); slower requests still land in +Inf.
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
  info:
    env:
      enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
  # Distributed tracing: Micrometer Tracing with the OpenTelemetry bridge, W3C traceparent propagation. Trace ids
  # are always generated (X-Trace-Id, logs, Kafka headers); sampling decides which traces are recorded and exported.
  # Spans are exported over OTLP/HTTP only when TRACING_EXPORT_ENABLED=true (container image, Kubernetes, the
  # deploy/observability stack); local runs and tests do not export.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # The actuator moves to its own port when MANAGEMENT_SERVER_PORT is set (8081 on Kubernetes and in
  # deploy/observability): Prometheus scrapes and the kubelet probes it without a session, and it is never
  # exposed publicly.
  # Unset, the actuator stays on the application port with /actuator/** other than health and info for ROLE_ADMIN.

info:
  app:
    name: ${spring.application.name}
    environment: ${APP_ENV:local}
    kafka-enabled: ${app.kafka.enabled}

logging:
  level:
    org.springframework.jdbc.datasource.init: INFO
    org.springframework.jdbc.core: INFO
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT_CONSOLE:logstash}
  pattern:
    level: "%5p [traceId=%X{traceId:-na} spanId=%X{spanId:-na}]"
